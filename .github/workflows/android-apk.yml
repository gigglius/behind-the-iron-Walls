name: Android APK build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  export-android:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4.1
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Import project resources
        run: godot --headless --editor --path . --quit

      - name: Export debug APK
        run: |
          mkdir -p build/android
          godot --headless --path . --export-debug "Android" build/android/BehindTheIronWalls-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BehindTheIronWalls-Quest3-debug
          path: build/android/BehindTheIronWalls-debug.apk
          if-no-files-found: error
          retention-days: 14
